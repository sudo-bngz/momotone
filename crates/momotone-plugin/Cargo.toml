[package]
name = "momotone-plugin"
description = "Momotone: genre-aware MIDI loop generator (VST3 / CLAP) by Momo's Basement"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
momotone-engine = { path = "../momotone-engine" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[features]
# Standalone app (no DAW), handy to try the UI: cargo run -p momotone-plugin --features standalone
standalone = ["nih_plug/standalone"]

[[bin]]
name = "momotone-standalone"
path = "src/main.rs"
required-features = ["standalone"]
