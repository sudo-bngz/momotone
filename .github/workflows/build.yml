name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI/audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo test --workspace

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-universal }
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI/audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Bundle (macOS universal)
        if: matrix.os == 'macos-latest'
        run: cargo xtask bundle-universal momotone-plugin --release
      - name: Bundle
        if: matrix.os != 'macos-latest'
        run: cargo xtask bundle momotone-plugin --release
      - uses: actions/upload-artifact@v4
        with:
          name: momotone-${{ matrix.name }}
          path: target/bundled/
